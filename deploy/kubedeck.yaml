apiVersion: v1
kind: Namespace
metadata:
  name: kubedeck
  labels:
    app.kubernetes.io/name: kubedeck
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubedeck
  namespace: kubedeck
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubedeck
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "secrets", "persistentvolumeclaims"]
    verbs: ["update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale", "replicasets/scale"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubedeck
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubedeck
subjects:
  - kind: ServiceAccount
    name: kubedeck
    namespace: kubedeck
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubedeck
  namespace: kubedeck
  labels:
    app.kubernetes.io/name: kubedeck
    app.kubernetes.io/component: console
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kubedeck
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubedeck
        app.kubernetes.io/component: console
    spec:
      serviceAccountName: kubedeck
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: docker.io/library/nginx:1.27
          imagePullPolicy: IfNotPresent
          command: ["/opt/kubedeck/kubedeck"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: CLUSTER_NAME
              value: "master"
            - name: DASHBOARD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kubedeck-auth
                  key: password
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: kubedeck-auth
                  key: session-secret
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 8
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: app
              mountPath: /opt/kubedeck
              readOnly: true
      volumes:
        - name: app
          hostPath:
            path: /opt/kubedeck
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: kubedeck
  namespace: kubedeck
  labels:
    app.kubernetes.io/name: kubedeck
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: kubedeck
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubedeck
  namespace: kubedeck
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kubedeck
                port:
                  name: http
